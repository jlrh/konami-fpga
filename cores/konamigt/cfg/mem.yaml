params:
  - { name: SND_OFFSET, value: "`SND_START >> 1" }
sdram:
  banks:
    - buses:
        - { name: main, addr_width: 18, data_width: 16 }
        - { name: snd,  addr_width: 14, data_width: 8, offset: SND_OFFSET }
bram:

  - { name: wav1, addr_width: 8, data_width: 4, prom: true, addr: wav1_addr, dout: wav1_data, simfile: {} }
  - { name: wav2, addr_width: 8, data_width: 4, prom: true, addr: wav2_addr, dout: wav2_data, simfile: {} }
