params:
  - { name: RAM_OFFSET,  value: "22'h100000" }
  - { name: PCM_OFFSET,  value: "22'h040000>>1" }

  - { name: SCRX_OFFSET, value: "23'h200000>>1" }

  - { name: OBJX_OFFSET, value: "23'h400000>>1" }

clocks:
  clk48:
    - freq: 16M
      outputs:
        - cen_16
        - cen_8
    - freq: 18432k

      outputs:
        - cen_pcm
audio:

  gain: 0.759
  rsum: 1k
  rsum_feedback_res: true

  channels:

    - { name: pcm1, module: jt054539, rsum: 1k,     rc: [ { r: 7.33k, c: 2.2n } ] }
    - { name: pcm2, module: jt054539, rsum: 3.14k,  rc: [ { r: 7.67k, c: 2.2n } ] }
sdram:
  banks:

    - buses:
        - name: main
          addr_width: 21
          data_width: 16

    - buses:
        - name: snd
          addr_width: 17
          data_width: 8
        - name: pcm
          addr_width: 22
          data_width: 8
          offset: PCM_OFFSET

    - buses:
        - name: scr
          addr_width: 21
          data_width: 32
        - name: scrx
          addr_width: 19
          data_width: 8
          offset: SCRX_OFFSET

    - buses:
        - name: obj
          addr_width: 23
          data_width: 64
        - name: objx
          addr_width: 20
          data_width: 16
          offset: OBJX_OFFSET
bram:

  - name: ram
    addr_width: 16
    data_width: 16
    rw: true
    dout: ram_data

  - name: nvram
    addr_width: 7
    data_width: 8
    simfile: {}
    rw: true
    ioctl: { save: true, restore: true, order: 0 }
