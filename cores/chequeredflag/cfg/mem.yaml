params:
  - { name: PCM_OFFSET,   value: "(`PCM_START  -`JTFRAME_BA1_START) >> 1" }
  - { name: PCM2_OFFSET,  value: "(`PCM2_START -`JTFRAME_BA1_START) >> 1" }
  - { name: PSAC2A_OFFSET,value: "(`PSAC2A_START-`JTFRAME_BA1_START) >> 1" }
clocks:
  clk48:
    - freq: 24M
      outputs:
        - cen24
        - cen12
    - freq: 3579545
      outputs:
        - cen_fm
        - cen_fm2
audio:
  rsum: 10k
  channels:
    - {name: fm,   rsum: 4.7k,  module: jt51     }
    - {name: pcm1, rsum: 10k, pre: 0.16, module: jt007232_stereo }
    - {name: pcm2, rsum: 10k, pre: 0.32, module: jt007232_stereo }
sdram:
  banks:
    - buses:
        - name: main
          addr_width: 19
          data_width: 8
    - buses:
        - name: snd
          addr_width: 15
          data_width: 8
        - name: pcma
          addr_width: 19
          data_width: 8
          offset: PCM_OFFSET
        - name: pcmb
          addr_width: 19
          data_width: 8
          offset: PCM_OFFSET
        - name: pcm2a
          addr_width: 19
          data_width: 8
          offset: PCM2_OFFSET
        - name: pcm2b
          addr_width: 19
          data_width: 8
          offset: PCM2_OFFSET

        - name: psac2a
          addr_width: 20
          data_width: 8
          offset: PSAC2A_OFFSET
    - buses:

        - name: psac2b
          addr_width: 20
          data_width: 8
    - buses:
        - name: lyro
          addr_width: 20
          data_width: 32
bram:

  - name: psac1
    addr_width: 17
    data_width: 8
    prom: true
    simfile: {}

  - name: ram
    addr_width: 13
    data_width: 8
    rw: true
